# ---------------------------------------------------------------------------
#  MultiverseGambling - reference value of items, in coins
# ---------------------------------------------------------------------------
#
#  Used by the poker table to turn items into chips. A diamond is worth 100 coins
#  and every other value follows from that anchor:
#
#  * vanilla: how hard the item is to obtain, against the diamond.
#  * slimefun: generated from the recipes of Slimefun itself. An item is worth
#    what its ingredients are worth, times what its machine or ritual adds
#    (enhanced crafting table x1.05, smeltery x1.08, magic workbench x1.15,
#    heated pressure chamber x1.15, ancient altar x1.40...), plus 0.5 coins per
#    experience level of its research, divided by how many the recipe makes.
#    Resources found in the world (sifted ore, uranium, oil...) have a fixed value.
#  * multiversecreatures: a drop is worth how hard its creature is to beat divided
#    by its drop chance; a crafted item is worth its ingredients x1.10 (x1.65 for
#    the legendary weapons, armour and relics); a merchant item is worth its trade.
#  * slimefun addons: every item of every installed addon is valued on each start
#    from its registered recipe with the same rule (see item-values-addons.yml).
#
#  Edit any number freely, or change "scale" to make every item worth more or less
#  in your economy. A vanilla or MultiverseCreatures item that is not listed has no
#  value and cannot be used.
#  /mvgam reload applies the changes.
# ---------------------------------------------------------------------------

# Multiplies every value below (0.5 = half price, 2 = double).
scale: 1.0

# Damaged tools and armour are worth their remaining durability.
scale-by-durability: true

