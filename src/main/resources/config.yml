# ============================================================================
#  MultiverseGambling - configuration
#
#  The house edge lives in a single place (game.house-edge) and almost every
#  game inherits it. If you want to tune one game, each section accepts its
#  own minimum and maximum bet.
#
#  Careful with the prize tables: the theoretical return of the slots, plinko,
#  scratch card and lucky wheel is pinned by automatic tests. If you change
#  weights or payouts, run "mvn test" to see the real return.
# ============================================================================

economy:
  # Which money the casino plays with. Every value falls back to the internal wallet
  # when the engine it names is not usable, so the plugin always starts.
  #   auto     = try the engines below, in order
  #   sbank    = the bank accounts of the sBank plugin
  #   vault    = whatever economy the server registers through Vault
  #   internal = the plugin's own balances.json, ignoring every other plugin
  provider: auto
  # Engines tried when provider is auto. Put sbank first on a server that keeps the
  # players' money in the bank; put vault first to gamble with the wallet instead.
  auto-order: [sbank, vault, internal]
  currency: coins
  # {amount} is the quantity and {currency} the name above.
  format: '&6{amount} &7{currency}'
  # Welcome balance for the internal wallet. Unused with sBank or Vault, which
  # hand out their own starting money.
  starting-balance: 1000

game:
  # Average house edge for every game. 0.02 = 2%.
  house-edge: 0.02
  min-bet: 10
  max-bet: 100000
  announce-wins: true
  announce-threshold: 50000

fairness:
  # Provably fair: publish the hash of the secret and let anyone audit every
  # roll with /mvgam verify. Leaving this on is strongly recommended.
  provably-fair: true

data:
  save-every-minutes: 5

# ---------------------------------------------------------------------------
#  Language. One code per file in plugins/MultiverseGambling/lang/.
#  Players switch it in game with /mvgam language <code>.
# ---------------------------------------------------------------------------
language:
  # Used for the console, for players with no preference and for the world signs.
  default: en
  # A player who never picked a language follows their Minecraft client when the
  # plugin ships that language.
  follow-client: true

# ---------------------------------------------------------------------------
#  Bets staked with items. Plinko, the lucky wheel, the classic roulette, the
#  coin flip, the dice and the slots accept items as well as money: the bet menu
#  has an "Item bet" button that opens a chest where the items are placed, and it
#  tells how many of them come back for every possible result. Winnings are paid
#  in copies of the same item (custom items keep all their data); a fraction of an
#  item is paid by chance, so the average payout is exact.
# ---------------------------------------------------------------------------
item-bets:
  enabled: true
  # Most items one bet can stake (1728 = 27 stacks of 64).
  max-items: 1728
  # Items that can never be staked: an exact name (DIAMOND), every name ending in
  # something (*_SHULKER_BOX) or starting with something (NETHERITE_*). Containers
  # are blocked by default, so nobody multiplies the contents of a box.
  blocked:
    - '*SHULKER_BOX'
    - '*BUNDLE'

# ---------------------------------------------------------------------------
#  The dedicated casino world: a flat stage of "size" x "size" blocks with a
#  marble plaza and a fountain at spawn, a grid of boulevards with lamps and
#  trees, and one walled pavilion per game. The plugin creates the world on first
#  start; point world.name at an existing world to reuse it.
#
#  The 21 games of the catalogue fill 408 x 408 blocks, so 500 leaves a green
#  belt round the edge. The world grows by itself when more games are added.
#  The casino is rebuilt on its own whenever its design changes (a plugin update,
#  a new game, a bigger board): the rebuild clears the surface of this world, so
#  keep your own builds in other worlds.
# ---------------------------------------------------------------------------
world:
  # Create (or load) the casino world when the plugin starts.
  enabled: true
  name: 'mvgam_casino'
  # Side of the square in blocks; the world border is centred on spawn.
  size: 500
  # Build the plaza, the pavilions and the boulevards when they are missing or out
  # of date. The build runs in the background, a few chunks per tick.
  build-structures: true
  # Send players to the casino world when they join the server.
  teleport-on-join: false
  # Keep the casino world at noon, always. Turn it off to use "time" instead.
  always-day: true
  # Hour the casino world is frozen at when always-day is off, in ticks: 6000 noon,
  # 13000 dusk (the lamps and the pavilions glow), 18000 midnight. -1 keeps the
  # normal day cycle.
  time: 13000
  # No creature ever appears in the casino world, and only players with mvgam_admin
  # can break or place blocks there. The shows of the games are not affected.

  # In world shows. Instead of only counting numbers in the action bar, every game
  # stages its round on its pavilion with display entities: a roulette wheel and its
  # ball, a slot machine with rolling drums, a rocket for crash, a plinko wall, a
  # coin toss, a card table, a horse race and more. The scenery is temporary and
  # removed a moment after the result.
  animations:
    enabled: true
    # Move the player to their pavilion so they see the show. With this off a round
    # is only animated for players who are already in the casino world; everybody
    # else keeps the action bar of the old days.
    teleport-players: true
    # Blocks between the centre of a pavilion and the spot the watcher stands on.
    view-distance: 14

# ---------------------------------------------------------------------------
#  Group games: values shared by all of them
# ---------------------------------------------------------------------------
group:
  # Seconds the betting window of each round stays open.
  betting-seconds: 20
  max-players: 24
  countdown: 5
  # Commission the house keeps from the jackpot, the raffle and dice poker.
  house-commission: 0.0

  bomb-board:
    tiles: 36
    bombs: 4
    seconds-per-turn: 10

  hot-bomb:
    min-seconds: 5
    max-seconds: 30

  russian-roulette:
    chambers: 6
    bullets: 1

  race:
    horses: 8
    steps: 60

  raffle:
    ticket-price: 100
    max-tickets: 20

  duel:
    accept-seconds: 30

# ---------------------------------------------------------------------------
#  Game catalogue
# ---------------------------------------------------------------------------
games:

  # --- Solo ---------------------------------------------------------------

  roulette:
    enabled: true
    american: false
    spin-ticks: 100

  slots:
    enabled: true
    spin-ticks: 60

  crash:
    enabled: true
    double-every-seconds: 10.0
    max-multiplier: 1000.0
    # Seconds the multiplier climbs before the round can bust.
    countdown: 5

  mines:
    enabled: true
    tiles: 25
    default-mines: 3
    max-mines: 24

  towers:
    enabled: true
    levels: 9
    # Difficulty highlighted in the menu: easy (4 doors, 1 bomb), medium (3, 1),
    # hard (2, 1), expert (3, 2) or master (4, 3). The player picks one every round.
    default-difficulty: medium

  blackjack:
    enabled: true
    decks: 6
    # With true the dealer hits on a soft 17, which is worse for the player.
    dealer-hits-soft-17: false

  high-low:
    enabled: true
    max-steps: 5

  dice:
    enabled: true

  plinko:
    enabled: true
    rows: 12
    # Safety cap: the rarest bucket of 16 rows would pay absurd figures.
    max-multiplier: 500.0

  scratch:
    enabled: true
    picks: 3

  lucky-wheel:
    enabled: true
    # Every segment has its own multiplier and all of them are equally likely.
    # The average is the return, so keeping it below 1 is the only rule.
    segments: [0.0, 1.3, 0.0, 2.0, 0.0, 4.0, 0.0, 1.6, 0.0, 2.5, 0.0, 0.0]

  coin-flip:
    enabled: true

  # --- Group --------------------------------------------------------------

  color-roulette:
    enabled: true

  jackpot:
    enabled: true

  hot-bomb:
    enabled: true

  bomb-board:
    enabled: true

  russian-roulette:
    enabled: true

  race:
    enabled: true

  duel:
    enabled: true

  raffle:
    enabled: true

  dice-poker:
    enabled: true

  # Texas hold'em at a table for up to 8 players, with the house filling in when you
  # are alone. min-bet and max-bet are the buy-in: the chips you sit down with.
  poker:
    enabled: true
    min-bet: 200
    max-bet: 1000000
    small-blind: 5
    big-blind: 10
    # Seconds a player has to act before the table checks or folds for them.
    action-seconds: 30
    # Pause between two hands.
    next-hand-seconds: 6
    # Share of each pot the house keeps once the flop is out (0.05 = 5%), and its cap
    # per pot in coins (0 = no cap). Players against players: nothing by default.
    rake: 0.0
    rake-cap: 0
    # Rake while the house plays at the table, so its seats are not free money.
    house-rake: 0.05
    # How many house players sit down when somebody asks to play the house.
    house-players: 1
    # Let players buy chips with items, valued with item-values.yml.
    item-buy-in: true
