# ============================================================================
#  MultiverseGambling - configuration
#
#  The house edge lives in a single place (game.house-edge) and almost every
#  game inherits it. If you want to tune one game, each section accepts its
#  own minimum and maximum bet.
#
#  Careful with the prize tables: the theoretical return of the slots, plinko,
#  scratch card and lucky wheel is pinned by automatic tests. If you change
#  weights or payouts, run "mvn test" to see the real return.
# ============================================================================

economy:
  # Which money the casino plays with. Every value falls back to the internal wallet
  # when the engine it names is not usable, so the plugin always starts.
  #   auto     = try the engines below, in order
  #   sbank    = the bank accounts of the sBank plugin
  #   vault    = whatever economy the server registers through Vault
  #   internal = the plugin's own balances.json, ignoring every other plugin
  provider: auto
  # Engines tried when provider is auto. Put sbank first on a server that keeps the
  # players' money in the bank; put vault first to gamble with the wallet instead.
  auto-order: [sbank, vault, internal]
  currency: coins
  # {amount} is the quantity and {currency} the name above.
  format: '&6{amount} &7{currency}'
  # Welcome balance for the internal wallet. Unused with sBank or Vault, which
  # hand out their own starting money.
  starting-balance: 1000

game:
  # Average house edge for every game. 0.02 = 2%.
  house-edge: 0.02
  min-bet: 10
  max-bet: 100000
  announce-wins: true
  announce-threshold: 50000

fairness:
  # Provably fair: publish the hash of the secret and let anyone audit every
  # roll with /mvgam verify. Leaving this on is strongly recommended.
  provably-fair: true

data:
  save-every-minutes: 5

# ---------------------------------------------------------------------------
#  Language. One code per file in plugins/MultiverseGambling/lang/.
#  Players switch it in game with /mvgam language <code>.
# ---------------------------------------------------------------------------
language:
  # Used for the console, for players with no preference and for the world signs.
  default: en
  # A player who never picked a language follows their Minecraft client when the
  # plugin ships that language.
  follow-client: true

# ---------------------------------------------------------------------------
#  The dedicated casino world: a flat stage of "size" x "size" blocks with the
#  plaza, the road grid and one arena per game. The plugin creates the world on
#  first start; point world.name at an existing world to reuse it.
# ---------------------------------------------------------------------------
world:
  # Create (or load) the casino world when the plugin starts.
  enabled: true
  name: 'mvgam_casino'
  # Side of the square in blocks; the world border is centred on spawn.
  size: 500
  # Build the plaza, the arenas and the roads the first time the world is used.
  build-structures: true
  # Send players to the casino world when they join the server.
  teleport-on-join: false

# ---------------------------------------------------------------------------
#  Group games: values shared by all of them
# ---------------------------------------------------------------------------
group:
  # Seconds the betting window of each round stays open.
  betting-seconds: 20
  max-players: 24
  countdown: 5
  # Commission the house keeps from the jackpot, the raffle and dice poker.
  house-commission: 0.0

  bomb-board:
    tiles: 36
    bombs: 4
    seconds-per-turn: 10

  hot-bomb:
    min-seconds: 5
    max-seconds: 30

  russian-roulette:
    chambers: 6
    bullets: 1

  race:
    horses: 8
    steps: 60

  raffle:
    ticket-price: 100
    max-tickets: 20

  duel:
    accept-seconds: 30

# ---------------------------------------------------------------------------
#  Game catalogue
# ---------------------------------------------------------------------------
games:

  # --- Solo ---------------------------------------------------------------

  roulette:
    enabled: true
    american: false
    spin-ticks: 60

  slots:
    enabled: true
    spin-ticks: 40

  crash:
    enabled: true
    double-every-seconds: 10.0
    max-multiplier: 1000.0

  mines:
    enabled: true
    tiles: 25
    default-mines: 3
    max-mines: 24

  towers:
    enabled: true
    levels: 9
    tiles: 4
    bombs: 1

  blackjack:
    enabled: true
    decks: 6
    # With true the dealer hits on a soft 17, which is worse for the player.
    dealer-hits-soft-17: false

  high-low:
    enabled: true
    max-steps: 5

  dice:
    enabled: true

  plinko:
    enabled: true
    rows: 12
    # Safety cap: the rarest bucket of 16 rows would pay absurd figures.
    max-multiplier: 500.0

  scratch:
    enabled: true
    picks: 3

  lucky-wheel:
    enabled: true
    # Every segment has its own multiplier and all of them are equally likely.
    # The average is the return, so keeping it below 1 is the only rule.
    segments: [0.0, 1.3, 0.0, 2.0, 0.0, 4.0, 0.0, 1.6, 0.0, 2.5, 0.0, 0.0]

  coin-flip:
    enabled: true

  # --- Group --------------------------------------------------------------

  color-roulette:
    enabled: true

  jackpot:
    enabled: true

  hot-bomb:
    enabled: true

  bomb-board:
    enabled: true

  russian-roulette:
    enabled: true

  race:
    enabled: true

  duel:
    enabled: true

  raffle:
    enabled: true

  dice-poker:
    enabled: true
