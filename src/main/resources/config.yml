# ============================================================================
#  MultiverseGambling - configuracion
#
#  La ventaja de la casa vive en un solo sitio (juego.ventaja-casa) y de ahi la
#  heredan casi todos los juegos. Si prefieres ajustar un juego concreto, cada
#  apartado admite su propia apuesta minima y maxima.
#
#  Ojo con las tablas de premios: el retorno teorico de la tragaperras, el plinko,
#  el rasca y la ruleta de la suerte esta fijado por tests automaticos. Si cambias
#  pesos o pagos, ejecuta "mvn test" para ver el retorno real.
# ============================================================================

economia:
  # auto  = usa Vault si el servidor lo tiene, si no el monedero interno
  # vault = obliga a Vault (si falla, avisa y usa el interno)
  # interno = usa siempre balances.json del propio plugin
  proveedor: auto
  moneda: monedas
  # {amount} es la cantidad y {moneda} el nombre de arriba.
  formato: '&6{amount} &7{moneda}'
  # Saldo de bienvenida del monedero interno. Con Vault no se usa.
  saldo-inicial: 1000

juego:
  # Ventaja media de la casa para todos los juegos. 0.02 = 2%.
  ventaja-casa: 0.02
  apuesta-minima: 10
  apuesta-maxima: 100000
  anunciar-premios: true
  anunciar-desde: 50000

azar:
  # Azar verificable: publica el hash del secreto y permite auditar cada tirada
  # con /casino verificar. Muy recomendable dejarlo activado.
  verificable: true

datos:
  guardar-cada-minutos: 5

# ---------------------------------------------------------------------------
#  Juegos en grupo: valores comunes a todos
# ---------------------------------------------------------------------------
grupo:
  # Segundos que dura la ventana de apuestas de cada ronda.
  segundos-de-apuestas: 20
  maximo-jugadores: 24
  cuenta-atras: 5
  # Comision que se queda la casa del bote comun, la rifa y el poker de dados.
  comision-casa: 0.0

  tablero-bombas:
    casillas: 36
    bombas: 4
    segundos-por-turno: 10

  bomba-caliente:
    segundos-minimos: 5
    segundos-maximos: 30

  ruleta-rusa:
    recamaras: 6
    balas: 1

  carrera:
    caballos: 8
    pasos: 60

  rifa:
    precio-boleta: 100
    boletas-maximas: 20

  duelo:
    segundos-para-aceptar: 30

# ---------------------------------------------------------------------------
#  Catalogo de juegos
# ---------------------------------------------------------------------------
juegos:

  # --- En solitario ---------------------------------------------------------

  ruleta:
    activo: true
    americana: false
    ticks-giro: 60

  tragamonedas:
    activo: true
    ticks-giro: 40

  crash:
    activo: true
    segundos-para-doblar: 10.0
    multiplicador-maximo: 1000.0

  minas:
    activo: true
    casillas: 25
    minas-por-defecto: 3
    minas-maximas: 24

  torre:
    activo: true
    pisos: 9
    casillas: 4
    bombas: 1

  blackjack:
    activo: true
    barajas: 6
    # Con true el crupier pide carta con 17 blando, que es peor para el jugador.
    crupier-pide-con-17-blando: false

  mayor-menor:
    activo: true
    pasos-maximos: 5

  dados:
    activo: true

  plinko:
    activo: true
    filas: 12
    # Tope de seguridad: el cubo mas raro de 16 filas pagaria cifras absurdas.
    multiplicador-maximo: 500.0

  rasca:
    activo: true

  ruleta-suerte:
    activo: true
    # Cada casilla tiene su multiplicador y todas son igual de probables.
    # La media es el retorno, asi que mantenerla por debajo de 1 es la unica regla.
    segmentos: [0.0, 1.3, 0.0, 2.0, 0.0, 4.0, 0.0, 1.6, 0.0, 2.5, 0.0, 0.0]

  cara-o-cruz:
    activo: true

  # --- En grupo -------------------------------------------------------------

  ruleta-colores:
    activo: true

  bote:
    activo: true

  bomba-caliente:
    activo: true

  tablero-bombas:
    activo: true

  ruleta-rusa:
    activo: true

  carrera:
    activo: true

  duelo:
    activo: true

  rifa:
    activo: true

  poker-dados:
    activo: true
