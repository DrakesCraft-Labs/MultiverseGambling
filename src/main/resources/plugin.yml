name: MultiverseGambling
version: '${project.version}'
main: com.chagui68.multiversegambling.MultiverseGamblingPlugin
api-version: '1.21'
authors: [Chagui68]
description: Chance and betting engine with 21 solo and group minigames, a casino world and in-game English or Spanish.
website: https://github.com/DrakesCraft-Labs/MultiverseGambling
softdepend: [Vault]

commands:
  casino:
    description: Casino menu, worlds, language picker and administration.
    usage: /casino menu
    aliases: [gambling, mg, bets]

permissions:
  casino.play:
    description: Allows entering the casino, playing the public games and picking a language.
    default: true
  casino.top:
    description: Allows viewing the server ranking.
    default: true
  casino.admin:
    description: Reload, build the casino world, give or take balance and cancel running games.
    default: op
