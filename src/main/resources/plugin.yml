name: MultiverseGambling
version: '${project.version}'
main: com.chagui68.multiversegambling.MultiverseGamblingPlugin
api-version: '1.21'
authors: [ Chagui68 ]
description: Chance and betting engine (Paper 1.21.11, 26.1 and 26.2) with 22 solo and group minigames, a casino world and in-game English or Spanish.
website: https://github.com/DrakesCraft-Labs/MultiverseGambling
softdepend: [ Vault, sBank ]

commands:
  mvgam:
    description: Casino menu, casino world, language picker and administration.
    usage: /mvgam menu

permissions:
  mvgam_play:
    description: Allows entering the casino, playing the public games and picking a language.
    default: true
  mvgam_top:
    description: Allows viewing the server ranking.
    default: true
  mvgam_admin:
    description: Reload, build or inspect the casino world, give or take balance and cancel running games.
    default: op
