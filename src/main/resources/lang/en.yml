# ============================================================================
#  MultiverseGambling - messages (English)
#
#  One file per language, inside plugins/MultiverseGambling/lang/.
#  Players switch language in game with: /mvgam language <code>
#
#  Colours use the classic ampersand format: &6 gold, &7 grey, &c red...
#  Curly braces are placeholders the plugin fills in: keep every {placeholder}
#  exactly as it is, including the ones inside panel.* (they feed the game menus).
#
#  panel.* holds the inside of every game: window titles, buttons, item lore and
#  the lines a menu prints in the chat, one section per game. group.* holds the
#  round lines of the group games (pots, draws, bombs...).
#
#  Game names and descriptions are written in the code in English. To override or
#  translate them, add a catalog.<game-id>.name / catalog.<game-id>.description
#  block at the end of this file: see lang/es.yml for the full Spanish catalogue.
# ============================================================================

