    name: 'Carrera de Caballos'
    description:
      - '&7Ocho caballos con sus probabilidades.'
      - '&7Apostar al favorito paga poco;'
      - '&7al tapado, mucho.'
  duel:
    name: 'Duelo 1v1'
    description:
