# ============================================================================
#  MultiverseGambling - mensajes (Español)
#
#  Un fichero por idioma, dentro de plugins/MultiverseGambling/lang/.
#  Los jugadores cambian de idioma en el juego con: /mvgam language <codigo>
#
#  Los colores usan el formato clasico con ampersand: &6 dorado, &7 gris...
#  Las llaves son huecos que rellena el plugin: deja cada {placeholder} tal cual,
#  tambien los de panel.* (son los que alimentan los menus de juego).
#
#  panel.* guarda el interior de cada juego: titulos de ventana, botones, lore de
#  los objetos y las lineas que el menu escribe en el chat, una seccion por juego.
#  group.* guarda las lineas de ronda de los juegos en grupo (botes, sorteos...).
#  ============================================================================

