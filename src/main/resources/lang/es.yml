  build-failed: '&cNo se pudo construir el mundo del casino &f{world}&c; revisa la consola del servidor.'

command:
  players-only: '&cEste comando es para usarlo dentro del juego.'
  unknown: '&cSubcomando desconocido: &f{subcommand}&c. Prueba &f/casino menu&c.'
  play-help: '&7Juega a cualquier juego con &f/casino play <juego>&7.'
  unknown-game: '&cNo existe ningun juego llamado &f{game}&c.'
  unknown-player: '&cNo encuentro al jugador &f{player}&c.'
  invalid-amount: '&c&f{value} &cno es una cantidad valida.'
  usage: '&cUso correcto: &f{usage}'
  balance: '&7Tu saldo es &6{balance}&7.'
  balance-other: '&7El saldo de &f{player}&7 es &6{balance}&7.'
  balance-updated: '&aSaldo de &f{player} &aactualizado a &6{balance}&a.'
