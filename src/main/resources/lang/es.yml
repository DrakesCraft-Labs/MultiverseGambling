# ============================================================================
#  Traduccion del catalogo de juegos
#
#  Los nombres y descripciones en ingles estan en el codigo; aqui solo hace
#  falta lo que quieras traducir. La clave es el id del juego y puedes cambiar
#  el nombre con "name" y las lineas de descripcion con "description".
# ============================================================================
catalog:
  roulette:
    name: 'Ruleta Clasica'
    description:
      - '&7Rojo, negro, docenas, columnas o un'
      - '&7numero exacto: de &f2x &7a &f36x&7.'
      - '&7El cero es verde y solo paga al numero.'
  slots:
    name: 'Tragamonedas'
    description:
      - '&7Tres rodillos, siete simbolos y un'
      - '&7jackpot de &f600x&7 en la corona.'
      - '&7Devuelve cerca del &f95%&7 de lo apostado.'
  crash:
    name: 'Crash'
    description:
      - '&7La curva sube y tu decides cuando salir.'
      - '&7Si no te sales a tiempo lo pierdes todo.'
      - '&7Ningun objetivo es mejor que otro.'
  mines:
    name: 'Minas'
    description:
      - '&7Destapa casillas seguras y retirate'
      - '&7cuando quieras. Con mas minas,'
      - '&7mas paga cada acierto.'
  towers:
    name: 'La Torre'
    description:
      - '&7Cada piso esconde una bomba entre'
      - '&7varias casillas. Sube todo lo que'
      - '&7puedas y retirate a tiempo.'
  blackjack:
    name: 'Blackjack'
    description:
      - '&7Llega a 21 sin pasarte y gana al'
      - '&7crupier. El natural paga &f3:2&7.'
      - '&7Pide, plantate o dobla.'
  high-low:
    name: 'Mayor o Menor'
    description:
      - '&7Adivina si la siguiente carta es mayor'
      - '&7o menor. Encadena aciertos para'
      - '&7multiplicar y retirate cuando quieras.'
  dice:
    name: 'Dados'
    description:
      - '&7Fija un objetivo del 0.01 al 99.99 y'
      - '&7apuesta a por encima o por debajo.'
      - '&7Cuanto mas dificil, mas paga.'
  plinko:
    name: 'Plinko'
    description:
      - '&7Suelta la bolita y mira en que cubo'
      - '&7cae. Los bordes pagan muchisimo'
      - '&7y el centro casi nada.'
  lucky-wheel:
    name: 'Ruleta de la Suerte'
    description:
      - '&7Doce segmentos, muchos vacios y'
      - '&7golpes de hasta &f4x&7. Una vuelta'
      - '&7decide el premio.'
  scratch:
    name: 'Rasca y Gana'
    description:
      - '&7Destapa tres casillas de nueve.'
      - '&7Tres iguales pagan el premio del simbolo'
      - '&7y dos iguales devuelven parte.'
  coin-flip:
    name: 'Cara o Cruz'
    description:
      - '&7Elige cara o cruz y dobla tu apuesta.'
      - '&7Rapido, limpio y sin excusas.'
  color-roulette:
    name: 'Ruleta de Colores'
    description:
      - '&7Rojo, negro o verde. Todos apuestan'
      - '&7y la rueda decide quien cobra.'
      - '&7El verde paga unas &f36x&7.'
  jackpot:
    name: 'Bote Comun'
    description:
      - '&7Todos ponen dinero en un mismo bote'
      - '&7y un sorteo ponderado decide quien'
      - '&7se lo lleva todo.'
  hot-bomb:
    name: 'Bomba Caliente'
    description:
      - '&7La bomba pasa de mano en mano.'
      - '&7Al que le pille con ella, fuera.'
      - '&7El ultimo en pie se lleva el bote.'
  bomb-board:
    name: 'Tablero de Bombas'
    description:
      - '&7Un tablero con bombas escondidas.'
      - '&7Por turnos, cada uno destapa una casilla.'
      - '&7El ultimo en pie se lleva el bote.'
  russian-roulette:
    name: 'Ruleta Rusa'
    description:
      - '&7Por turnos, cada uno aprieta el gatillo.'
      - '&7Con &f1 bala en 6 recamaras&7, la suerte'
      - '&7decide quien queda en pie.'
