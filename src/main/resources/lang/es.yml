# ============================================================================
#  MultiverseGambling - mensajes (Español)
#
#  Un fichero por idioma, dentro de plugins/MultiverseGambling/lang/.
#  Los jugadores cambian de idioma en el juego con: /casino language <codigo>
#
#  Los colores usan el formato clasico con ampersand: &6 dorado, &7 gris...
#  Las llaves son huecos que rellena el plugin:
#    {bet} {prize} {profit} {amount} {game} {player} {min} {max}
#    {seconds} {round} {current} {balance} {currency} {seed} {value} {usage}
#    {language} {languages} {native} {world} {hash} {state} {description}
#  ============================================================================

prefix: '&8[&6Casino&8] &r'

general:
  no-permission: '&cNo tienes permiso para hacer eso.'

economy:
  not-enough-money: '&cNo puedes pagar una apuesta de {bet}.'
  account-created: '&7Bienvenido al casino. Te hemos abierto una cuenta con {balance}.'

games:
  disabled: '&cEl juego &f{game} &cesta desactivado en la configuracion.'
  already-playing: '&cYa tienes una partida abierta. Termínala o ciérrala antes de empezar otra.'
  win: '&aHas ganado &f{prize} &a(apostaste {bet}, beneficio de {profit}).'
  tie: '&eEmpate: recuperas tus {bet}.'
  lose: '&cHas perdido los {bet} que tenias apostados.'
  abandoned: '&cHas dejado la partida y has perdido {bet}.'
  global-announcement: '&8[&6Casino&8] &f{player} &7acaba de ganar &6{prize} &7en el casino (beneficio de &6{profit}&7).'
  play-again-prompt: '&7¿Otra ronda? '
  play-again-button: '&a&l[ JUGAR OTRA VEZ ]'
  play-again-hover: '&7Jugar a {game} otra vez'
  win-title: '&6&l¡HAS GANADO!'
  lose-title: '&c&lSIN PREMIO'

group:
  waiting-players: '&7Esperando jugadores para empezar: &f{current}&7/&f{min}&7.'
  betting-open: '&aLas apuestas estan abiertas &f{seconds}s&a. Puedes entrar ya.'
  betting-hint: '&7Usa &f/casino play <juego> &7para entrar.'
  countdown: '&eLa ronda empieza en &f{seconds}&e...'
  time-left: '&7Quedan &f{seconds}s &7para cerrar las apuestas.'
  round-starting: '&6¡Empieza la ronda &f{round}&6!'
