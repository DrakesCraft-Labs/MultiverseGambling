  round-cancelled: '&cNo hay suficientes jugadores con apuesta (minimo {min}); se devuelve todo.'
  round-in-progress: '&eEsa ronda esta en marcha; te hemos apuntado a la siguiente.'
  queued-next: '&7Estas apuntado a la siguiente ronda de &f{game}&7. Te avisaremos.'
  already-queued: '&7Ya estabas apuntado a la siguiente ronda.'
  bet-accepted: '&aApuesta de &f{amount} &aaceptada en &f{game}&a.'
  betting-open-again: '&eEmpieza otra ronda de &f{game}&e: vuelve a entrar y apuesta.'
  room-full: '&cLa sala esta llena (maximo {max}). Prueba la siguiente ronda.'
  not-in-table: '&cNo estas en ninguna partida abierta.'
  not-in-color-round: '&cNo estas en esta ronda de ruleta.'
  not-betting-this-round: '&cNo estas apostando en esta ronda.'
  unknown-action: '&cEsa accion no existe en este juego.'
  invalid-tile: '&cEsa casilla no es valida.'
  invalid-horse: '&cEse caballo no existe.'
  russian-roulette-finished: '&7La partida ya ha terminado.'
  russian-roulette-not-your-turn: '&cNo es tu turno; &f{player} &cdebe disparar.'

duel:
  self-duel: '&cNo puedes retarte a ti mismo.'
  already-busy: '&cTanto tu como ese jugador ya teneis un duelo pendiente.'
  rival-cannot-afford: '&c{player} no tiene saldo suficiente para aceptar ese duelo.'
  challenge-sent: '&aReto enviado a &f{player} &apor &f{amount}&a. Espera su respuesta.'
  challenge-no-funds: '&cTu rival no tenia saldo; aqui tienes tu apuesta.'
  challenge-expired: '&c{player} no respondio al reto y se te devuelve la apuesta.'
  challenge-declined: '&c{player} ha rechazado el duelo y se te devuelve la apuesta.'
  challenge-timed-out: '&7El duelo caduco sin respuesta.'
  declined: '&7Has rechazado el duelo.'
  no-challenge: '&cNo tienes ningun duelo pendiente.'

fairness:
  explanation: '&7Cada tirada sale de un secreto del servidor y de tu semilla. Cuando el secreto rote podras recalcularla y comprobar que nada se ha tocado.'
  your-seed: '&7Tu semilla actual es &f{seed}&7. Puedes cambiarla con &f/casino verify <texto>&7.'
  seed-changed: '&aTu semilla ahora es &f{seed}&a.'

