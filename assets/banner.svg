<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="920" height="240" role="img" aria-label="MultiverseGambling - casino world, 22 games, provably fair. By Chagui68 for Drakes Labs.">
  <title>MultiverseGambling</title>
  <defs>
    <linearGradient id="bFondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="acG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="bHalo" cx="0.5" cy="0.32" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="920" height="240" rx="16" fill="url(#bFondo)"/>
  <rect width="920" height="240" rx="16" fill="url(#bHalo)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="1" width="918" height="238" rx="15" fill="none" stroke="url(#acG)" stroke-width="2" opacity=".4"/>

  <!-- floating chips and dice in the background -->
  <g opacity="0.5">
    <g transform="translate(120,70)">
      <circle r="14" fill="none" stroke="#C084FC" stroke-width="3" stroke-dasharray="5 4"/>
      <circle r="7" fill="#8B5CF6"/>
      <animateTransform attributeName="transform" type="translate" values="120,70;120,60;120,70" dur="5s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(800,80)">
      <circle r="12" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4 4"/>
      <circle r="6" fill="#F59E0B"/>
      <animateTransform attributeName="transform" type="translate" values="800,80;800,92;800,80" dur="6s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(80,160)">
      <rect x="-12" y="-12" width="24" height="24" rx="5" fill="none" stroke="#C084FC" stroke-width="2"/>
      <circle cx="-5" cy="-5" r="2.2" fill="#C084FC"/><circle r="2.2" fill="#C084FC"/><circle cx="5" cy="5" r="2.2" fill="#C084FC"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="14s" repeatCount="indefinite" additive="sum"/>
    </g>
    <g transform="translate(840,160)">
      <rect x="-12" y="-12" width="24" height="24" rx="5" fill="none" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="-5" cy="-5" r="2.2" fill="#F59E0B"/><circle cx="5" cy="-5" r="2.2" fill="#F59E0B"/><circle cx="-5" cy="5" r="2.2" fill="#F59E0B"/><circle cx="5" cy="5" r="2.2" fill="#F59E0B"/>
      <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="16s" repeatCount="indefinite" additive="sum"/>
    </g>
  </g>

  <!-- the roulette wheel -->
  <g transform="translate(460,70) scale(1.6)">
    <circle r="27" fill="#1E293B" stroke="url(#goldG)" stroke-width="2.5"/>
    <g>
      <circle r="21" fill="none" stroke="#DC2626" stroke-width="8" stroke-dasharray="8.25 8.25"/>
      <circle r="21" fill="none" stroke="#0B0F19" stroke-width="8" stroke-dasharray="8.25 8.25" stroke-dashoffset="8.25"/>
      <circle r="21" fill="none" stroke="#16A34A" stroke-width="8" stroke-dasharray="4 128"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </g>
    <circle r="15" fill="#0F172A" stroke="url(#acG)" stroke-width="1.5"/>
    <g stroke="url(#goldG)" stroke-width="1.6" stroke-linecap="round">
      <line x1="-8" y1="0" x2="8" y2="0"/>
      <line x1="0" y1="-8" x2="0" y2="8"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="9s" repeatCount="indefinite"/>
    </g>
    <circle r="3.2" fill="url(#goldG)"/>
    <g>
      <circle cx="0" cy="-24.5" r="2.2" fill="#F8FAFC"/>
      <animateTransform attributeName="transform" type="rotate" values="0;-360;-720;-900" keyTimes="0;0.4;0.75;1" dur="6s" repeatCount="indefinite"/>
    </g>
  </g>

  <text x="460" y="152" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="900" font-size="28" fill="#F8FAFC" letter-spacing="2">MULTIVERSEGAMBLING</text>
  <rect x="300" y="132" width="60" height="26" fill="url(#shine)" opacity="0.18">
    <animate attributeName="x" values="250;620;620" keyTimes="0;0.5;1" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="460" y="184" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="700" font-size="12" fill="#C084FC" letter-spacing="3">CASINO WORLD · 22 GAMES · ITEM BETS · PROVABLY FAIR
    <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>
  </text>

  <g transform="translate(460,210)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="700" font-size="10" text-anchor="middle">
    <g transform="translate(-180,0)">
      <rect x="-55" y="-10" width="110" height="20" rx="4" fill="#1E293B" stroke="#8B5CF6" stroke-opacity=".6"/>
      <text y="3.5" fill="#C084FC" letter-spacing="1">DRAKES LABS</text>
    </g>
    <g transform="translate(-60,0)">
      <rect x="-55" y="-10" width="110" height="20" rx="4" fill="#1E293B" stroke="#8B5CF6" stroke-opacity=".6"/>
      <text y="3.5" fill="#E2E8F0" letter-spacing="1">PAPER 1.21.11</text>
    </g>
    <g transform="translate(60,0)">
      <rect x="-55" y="-10" width="110" height="20" rx="4" fill="#1E293B" stroke="#8B5CF6" stroke-opacity=".6"/>
      <text y="3.5" fill="#E2E8F0" letter-spacing="1">JAVA 21</text>
    </g>
    <g transform="translate(180,0)">
      <rect x="-55" y="-10" width="110" height="20" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-opacity=".7"/>
      <text y="3.5" fill="#FCD34D" letter-spacing="1">BY CHAGUI68</text>
    </g>
  </g>
</svg>
